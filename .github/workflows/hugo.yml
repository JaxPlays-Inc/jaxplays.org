name: Build and deploy JaxPlays

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Install Python dependencies
        run: python3 -m pip install --user PyYAML
      - name: Check generated data
        if: github.event_name == 'pull_request'
        run: scripts/check_generated_data.sh
      - name: Test newsletter worker
        run: npm test
        working-directory: workers/newsletter
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_URL="https://jaxplays.org/"
          else
            BASE_URL="${{ steps.pages.outputs.base_url }}/"
          fi

          scripts/build_site.sh \
            --minify \
            --baseURL "$BASE_URL"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./sites/jaxplays/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: https://jaxplays.org
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send Pushover Success Notification
        if: success()  # This ensures the step only runs if the previous steps were successful
        uses: umahmood/pushover-actions@main
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        with:
          status: ${{ job.status }}
          title: 'Success! Deployment Complete'
          message: 'Your update to jaxplays.org has been successfully deployed to GitHub Pages.'

      - name: Send Pushover Failure Notification
        if: failure()  # This ensures the step only runs if the previous steps failed
        uses: umahmood/pushover-actions@main
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        with:
          status: ${{ job.status }}
          title: 'Failed. Deployment Incomplete'
          message: 'Your update to jaxplays.org has failed to deploy to GitHub Pages. Check the logs for details.'

  mailchimp_draft:
    name: Create Mailchimp draft campaigns
    needs: deploy
    runs-on: ubuntu-latest
    # Only run this job on push events, not on schedule or manual dispatch
    if: github.event_name == 'push'
    env:
      MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
      MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
      MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
      MAILCHIMP_FROM_EMAIL: ${{ secrets.MAILCHIMP_FROM_EMAIL }}
      MAILCHIMP_FROM_NAME: ${{ secrets.MAILCHIMP_FROM_NAME }}
      MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
      MAILCHIMP_DRAFT_INCLUDE_UPDATED_POSTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python3 -m pip install --user PyYAML Markdown

      - name: Find review and news draft candidates
        id: find_posts
        run: |
          echo "Checking for review and news content files between:"
          echo "  Before: ${{ github.event.before }}"
          echo "  After:  ${{ github.sha }}"
          echo "  Include updated posts: ${MAILCHIMP_DRAFT_INCLUDE_UPDATED_POSTS}"

          if [ "${MAILCHIMP_DRAFT_INCLUDE_UPDATED_POSTS}" = "true" ]; then
            INCLUDE_UPDATES='true'
          else
            INCLUDE_UPDATES='false'
          fi

          NEW_FILES=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" \
            | awk -v include_updates="$INCLUDE_UPDATES" '
                $1 == "A" { print $2 }
                include_updates == "true" && $1 == "M" { print $2 }
                include_updates == "true" && $1 ~ /^R/ { print $3 }
              ' \
            | grep -E '^sites/jaxplays/content/(reviews|news)/' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No review or news draft candidates found. Skipping Mailchimp."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Mailchimp draft candidate content files:"
          printf "%s\n" "$NEW_FILES"
          printf "%s\n" "$NEW_FILES" > new_files.txt

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Create Mailchimp draft campaigns
        if: steps.find_posts.outputs.has_new == 'true'
        run: |
          python3 scripts/create_mailchimp_drafts.py \
            --files new_files.txt \
            --site-root sites/jaxplays

  webpushr_notifications:
    name: Send Webpushr notifications
    needs: deploy
    runs-on: ubuntu-latest
    # Only run this job on push events after the site has deployed successfully.
    if: github.event_name == 'push'
    env:
      HUGO_VERSION: 0.163.3
      WEBPUSHR_API_KEY: ${{ secrets.WEBPUSHR_API_KEY }}
      WEBPUSHR_API_AUTH_TOKEN: ${{ secrets.WEBPUSHR_API_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Python dependencies
        run: python3 -m pip install --user PyYAML

      - name: Find newly added reviews and news
        id: find_posts
        run: |
          echo "Checking for newly added review and news content files between:"
          echo "  Before: ${{ github.event.before }}"
          echo "  After:  ${{ github.sha }}"

          NEW_FILES=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" \
            | awk '$1=="A"{print $2}' \
            | grep -E '^sites/jaxplays/content/(reviews|news)/' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new review or news files added. Skipping Webpushr."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Newly added content files:"
          printf "%s\n" "$NEW_FILES"
          printf "%s\n" "$NEW_FILES" > new_files.txt

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Send Webpushr notifications
        if: steps.find_posts.outputs.has_new == 'true'
        run: |
          python3 scripts/send_webpushr_notifications.py \
            --files new_files.txt \
            --site-root sites/jaxplays
