<!-- Include Leaflet CSS and JS -->
<link rel="stylesheet" href="/leaflet/leaflet.css" />
<script src="/leaflet/leaflet.js"></script>

<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

<link rel="stylesheet" href="/leaflet/extramarkers/css/leaflet.extra-markers.min.css">
<script src="/leaflet/extramarkers/js/leaflet.extra-markers.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="/leaflet/zoomhome/leaflet.zoomhome.css"/>
<script src="/leaflet/zoomhome/leaflet.zoomhome.min.js"></script>

<link rel="stylesheet" href="/leaflet/fullscreen/Control.FullScreen.css" />
<script src="/leaflet/fullscreen/Control.FullScreen.js"></script>

<!-- Initialize Map -->
<div id="map{{ .id }}" class="w-90 w-100-ns vh-40-ns vh-25 justify-center"></div>
<script>
  (function () {
    const lat = {{ .Latitude }};
    const lng = {{ .Longitude }};
    const title = {{ .Title | default "" | jsonify | safeJS }};
    const address = {{ .Address | default "" | jsonify | safeJS }};
    const formattedAddress = address.replace(/\n/g, "<br>");
    const minZoom = {{ with .minZoom }}{{ . }}{{ else }}4{{ end }};
    const maxZoom = {{ with .maxZoom }}{{ . }}{{ else }}20{{ end }};
    const setZoom = {{ with .setZoom }}{{ . }}{{ else }}15{{ end }};
    const radius = {{ with .radius }}{{ . }}{{ else }}""{{ end }};

    // Initialize map with fullscreen control and disabled default zoom control
    const mapId = 'map{{ .id }}';
    const mymap = L.map(mapId, {
        minZoom,
        maxZoom,
        zoomControl: false,
        fullscreenControl: true,
        fullscreenControlOptions: {
            position: 'topleft'
        }
    }).setView([lat, lng], setZoom);

    // Add zoomhome control
    var zoomHome = L.Control.zoomHome();
    zoomHome.addTo(mymap);

    const openFreeMapStyles = {
        light: 'https://tiles.openfreemap.org/styles/positron',
        dark: 'https://tiles.openfreemap.org/styles/dark'
    };
    let openFreeMapLayer;
    let activeOpenFreeMapStyle;

    function isDarkModeEnabled() {
        const storedDarkMode = localStorage.getItem('darkMode');
        return storedDarkMode === 'enabled' ||
            (window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches &&
                storedDarkMode !== 'disabled');
    }

    function setOpenFreeMapStyle() {
        const nextStyle = isDarkModeEnabled() ? openFreeMapStyles.dark : openFreeMapStyles.light;

        if (activeOpenFreeMapStyle === nextStyle) {
            return;
        }

        if (openFreeMapLayer) {
            mymap.removeLayer(openFreeMapLayer);
        }

        openFreeMapLayer = L.maplibreGL({
            style: nextStyle
        }).addTo(mymap);
        activeOpenFreeMapStyle = nextStyle;
    }

    setOpenFreeMapStyle();

    new MutationObserver(setOpenFreeMapStyle).observe(document.body, {
        attributes: true,
        attributeFilter: ['class']
    });

    if (window.matchMedia) {
        const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        if (darkModeQuery.addEventListener) {
            darkModeQuery.addEventListener('change', setOpenFreeMapStyle);
        } else if (darkModeQuery.addListener) {
            darkModeQuery.addListener(setOpenFreeMapStyle);
        }
    }

    const jaxplaysMarker = L.ExtraMarkers.icon({
      icon: 'fa-theater-masks',
      markerColor: 'yellow',
      shape: 'circle',
      prefix: 'fas'
    });

    if (radius) {
      L.circle([lat, lng], {
        color: '#ffd316',
        fillColor: '#ffd316',
        fillOpacity: 0.5,
        radius: radius
      }).addTo(mymap);
    }

    // Conditionally add a marker and bind popup if title or address exists
    if (title || formattedAddress) {
        const popupContent = "<b>" + title + "</b></br>" + formattedAddress;
        const marker = L.marker([lat, lng], {icon: jaxplaysMarker}).bindPopup(popupContent).addTo(mymap);
        marker.openPopup();
    }
  }());
</script>
